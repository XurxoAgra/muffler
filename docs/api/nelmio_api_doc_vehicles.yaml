nelmio_api_doc:
    documentation:
        paths:
            /api/vehicles:
                get:
                    tags: [Vehicles]
                    summary: Lista los vehículos del usuario autenticado (propios y compartidos)
                    security:
                        - bearerAuth: []
                    responses:
                        '200':
                            description: Listado de vehículos
                            content:
                                application/json:
                                    schema:
                                        type: array
                                        items: { $ref: '#/components/schemas/Vehicle' }
                        '401':
                            description: Token JWT ausente o inválido
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                post:
                    tags: [Vehicles]
                    summary: Crea un vehículo
                    description: El usuario autenticado se asocia automáticamente como propietario (role=owner).
                    security:
                        - bearerAuth: []
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema: { $ref: '#/components/schemas/VehicleInput' }
                    responses:
                        '201':
                            description: Vehículo creado
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/Vehicle' }
                        '400':
                            description: Datos de entrada inválidos (vin, makeId/modelId, customMake/customModel)
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '401':
                            description: Token JWT ausente o inválido
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/vehicles/{id}:
                get:
                    tags: [Vehicles]
                    summary: Detalle de un vehículo
                    security:
                        - bearerAuth: []
                    parameters:
                        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
                    responses:
                        '200':
                            description: Vehículo encontrado
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/Vehicle' }
                        '401':
                            description: Token JWT ausente o inválido
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '403':
                            description: El usuario no tiene acceso a este vehículo (sin vínculo VehicleUser)
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '404':
                            description: El vehículo no existe
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                put:
                    tags: [Vehicles]
                    summary: Actualiza un vehículo
                    description: Accesible para cualquier usuario vinculado (owner o shared).
                    security:
                        - bearerAuth: []
                    parameters:
                        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema: { $ref: '#/components/schemas/VehicleInput' }
                    responses:
                        '200':
                            description: Vehículo actualizado
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/Vehicle' }
                        '400':
                            description: Datos de entrada inválidos (vin, makeId/modelId, customMake/customModel)
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '401':
                            description: Token JWT ausente o inválido
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '403':
                            description: El usuario no tiene acceso a este vehículo (sin vínculo VehicleUser)
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '404':
                            description: El vehículo no existe
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                delete:
                    tags: [Vehicles]
                    summary: Elimina un vehículo
                    description: Solo el propietario (role=owner) puede eliminarlo.
                    security:
                        - bearerAuth: []
                    parameters:
                        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
                    responses:
                        '204':
                            description: Vehículo eliminado
                        '401':
                            description: Token JWT ausente o inválido
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '403':
                            description: El usuario no es el propietario del vehículo, o no tiene acceso
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '404':
                            description: El vehículo no existe
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/vehicles/{vehicleId}/mileage-records:
                get:
                    tags: [Vehicles]
                    summary: Lists the odometer history of a vehicle
                    description: Ordered by recordedAt descending.
                    security:
                        - bearerAuth: []
                    parameters:
                        - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
                    responses:
                        '200':
                            description: Listado de snapshots de kilometraje
                            content:
                                application/json:
                                    schema:
                                        type: array
                                        items: { $ref: '#/components/schemas/MileageRecord' }
                        '401':
                            description: Token JWT ausente o inválido
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '403':
                            description: El usuario no tiene acceso a este vehículo (sin vínculo VehicleUser)
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '404':
                            description: El vehículo no existe
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                post:
                    tags: [Vehicles]
                    summary: Records a manual odometer snapshot
                    description: >
                        Snapshots created here always carry source=manual. Snapshots with
                        source=maintenance_record are created automatically when a maintenance record
                        is registered with a mileage higher than the latest known one.
                    security:
                        - bearerAuth: []
                    parameters:
                        - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema: { $ref: '#/components/schemas/MileageRecordInput' }
                    responses:
                        '201':
                            description: Snapshot de kilometraje creado
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/MileageRecord' }
                        '400':
                            description: El kilometraje es negativo
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '401':
                            description: Token JWT ausente o inválido
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '403':
                            description: El usuario no tiene acceso a este vehículo (sin vínculo VehicleUser)
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '404':
                            description: El vehículo no existe
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '409':
                            description: El kilometraje es menor que el último snapshot registrado
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '422':
                            description: Datos de entrada inválidos (mileage, recordedAt)
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/vehicles/{vehicleId}/users:
                get:
                    tags: [Vehicles]
                    summary: Lists the users who have access to a vehicle
                    description: Includes the owner's own entry.
                    security:
                        - bearerAuth: []
                    parameters:
                        - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
                    responses:
                        '200':
                            description: List of users with access
                            content:
                                application/json:
                                    schema:
                                        type: array
                                        items: { $ref: '#/components/schemas/VehicleUserSummary' }
                        '401':
                            description: Missing or invalid JWT token
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '403':
                            description: The user has no access to this vehicle
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '404':
                            description: The vehicle does not exist
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                post:
                    tags: [Vehicles]
                    summary: Invites an already-registered user to share a vehicle
                    description: Only the vehicle owner can invite. The invited user must already be registered; there is no pending-invitation flow.
                    security:
                        - bearerAuth: []
                    parameters:
                        - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema: { $ref: '#/components/schemas/InviteUserInput' }
                    responses:
                        '201':
                            description: User invited
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/VehicleUserSummary' }
                        '401':
                            description: Missing or invalid JWT token
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '403':
                            description: Only the vehicle owner can invite users
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '404':
                            description: The vehicle does not exist, or the email does not match a registered user
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '409':
                            description: The invited user already has access to this vehicle
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '422':
                            description: Invalid input (email)
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/vehicles/{vehicleId}/users/{userId}:
                delete:
                    tags: [Vehicles]
                    summary: Revokes a user's access to a vehicle
                    description: The owner can revoke any shared user; a shared user can revoke themselves. The owner can never be revoked.
                    security:
                        - bearerAuth: []
                    parameters:
                        - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
                        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
                    responses:
                        '204':
                            description: Access revoked
                        '400':
                            description: The target user is the vehicle's owner and cannot be revoked
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '401':
                            description: Missing or invalid JWT token
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '403':
                            description: The user has no access to this vehicle, or is not allowed to revoke this target
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '404':
                            description: The vehicle does not exist, or the target user has no access to it
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/vehicle-makes:
                get:
                    tags: [Vehicle Catalog]
                    summary: Lista todas las marcas del catálogo, ordenadas alfabéticamente
                    security:
                        - bearerAuth: []
                    responses:
                        '200':
                            description: Listado de marcas
                            content:
                                application/json:
                                    schema:
                                        type: array
                                        items: { $ref: '#/components/schemas/VehicleSummary' }
                        '401':
                            description: Token JWT ausente o inválido
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/vehicle-makes/{id}/models:
                get:
                    tags: [Vehicle Catalog]
                    summary: Lista los modelos de una marca, ordenados alfabéticamente
                    security:
                        - bearerAuth: []
                    parameters:
                        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
                    responses:
                        '200':
                            description: Listado de modelos
                            content:
                                application/json:
                                    schema:
                                        type: array
                                        items: { $ref: '#/components/schemas/VehicleSummary' }
                        '401':
                            description: Token JWT ausente o inválido
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '404':
                            description: La marca no existe
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
