nelmio_api_doc:
    documentation:
        info:
            title: Muffler API
            description: API de autenticación (registro, login, refresh, logout y perfil) basada en JWT.
            version: 1.0.0
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
            schemas:
                ErrorResponse:
                    type: object
                    properties:
                        error:
                            type: object
                            properties:
                                code: { type: string, example: VALIDATION_ERROR }
                                message: { type: string }
                                details: { type: object }
                VehicleCatalogRef:
                    type: object
                    nullable: true
                    properties:
                        id: { type: string, format: uuid, example: 019eec01-1da5-7718-bb19-1164654bd689 }
                        name: { type: string, example: Corolla }
                Vehicle:
                    type: object
                    properties:
                        id: { type: string, format: uuid, example: 019eec01-1e15-7715-9841-572e528a6d80 }
                        plate: { type: string, example: 1234ABC }
                        year: { type: integer, example: 2021 }
                        type: { type: string, example: car }
                        vin: { type: string, nullable: true, example: 1HGCM82633A123456 }
                        make: { $ref: '#/components/schemas/VehicleCatalogRef' }
                        model: { $ref: '#/components/schemas/VehicleCatalogRef' }
                        custom_make: { type: string, nullable: true, example: null }
                        custom_model: { type: string, nullable: true, example: null }
                        role: { type: string, enum: [owner, shared], example: owner }
                VehicleInput:
                    type: object
                    required: [plate, year, type]
                    description: >
                        Debe venir el par (makeId, modelId) o el par (customMake, customModel);
                        ambos pares no pueden estar vacíos a la vez.
                    properties:
                        plate: { type: string, example: 1234ABC }
                        year: { type: integer, example: 2021 }
                        type: { type: string, example: car }
                        vin:
                            type: string
                            nullable: true
                            description: 17 caracteres alfanuméricos, sin I, O ni Q
                            example: 1HGCM82633A123456
                        makeId: { type: string, format: uuid, nullable: true, example: 019eec01-1d2d-7261-a672-2238b9ba1465 }
                        modelId: { type: string, format: uuid, nullable: true, example: 019eec01-1da5-7718-bb19-1164654bd689 }
                        customMake: { type: string, nullable: true, example: null }
                        customModel: { type: string, nullable: true, example: null }
                VehicleSummary:
                    type: object
                    properties:
                        id: { type: string, format: uuid, example: 019eec01-1d2d-7261-a672-2238b9ba1465 }
                        name: { type: string, example: Toyota }
                MileageRecord:
                    type: object
                    properties:
                        id: { type: string, format: uuid, example: 019eec07-2c33-7a44-8d55-4e5f60718293 }
                        vehicleId: { type: string, format: uuid, example: 019eec01-1e15-7715-9841-572e528a6d80 }
                        mileage: { type: integer, example: 45000 }
                        recordedAt: { type: string, format: date-time, example: '2026-05-01T10:30:00+00:00' }
                        source:
                            type: string
                            enum: [manual, maintenance_record]
                            description: >
                                manual for a snapshot entered by the user, maintenance_record for one
                                derived from the mileage of a maintenance record.
                            example: manual
                MileageRecordInput:
                    type: object
                    required: [mileage]
                    properties:
                        mileage:
                            type: integer
                            description: >
                                Cannot be negative, and cannot be lower than the latest snapshot of the
                                vehicle; the odometer only moves forward.
                            example: 45000
                        recordedAt:
                            type: string
                            format: date-time
                            nullable: true
                            description: ISO-8601 date-time. Defaults to the current time when omitted.
                            example: '2026-05-01T10:30:00+00:00'
                MaintenanceRecord:
                    type: object
                    properties:
                        id: { type: string, format: uuid, example: 019eec05-1a22-7b33-9c44-3d4e5f607182 }
                        vehicleId: { type: string, format: uuid, example: 019eec01-1e15-7715-9841-572e528a6d80 }
                        invoiceId: { type: string, format: uuid, nullable: true, example: null }
                        createdById: { type: string, format: uuid, example: 019eec01-1d2d-7261-a672-2238b9ba1465 }
                        serviceDate: { type: string, format: date, example: 2026-05-01 }
                        mileage: { type: integer, nullable: true, example: 45000 }
                        maintenanceRecordTypeId: { type: string, format: uuid, example: 019eec10-0000-7000-8000-000000000004 }
                        notes: { type: string, nullable: true, example: null }
                        cost: { type: string, nullable: true, example: '120.50' }
                        shopName: { type: string, nullable: true, example: Taller Pepe }
                        nextServiceDate: { type: string, format: date, nullable: true, example: null }
                        verified:
                            type: boolean
                            description: >
                                Denormalizado a partir de la verificación del taller (Fase 3); no se puede
                                establecer mediante la API de creación/edición manual, siempre es false.
                            example: false
                        createdAt: { type: string, format: date-time }
                MaintenanceRecordInput:
                    type: object
                    required: [serviceDate, maintenanceRecordTypeId]
                    properties:
                        serviceDate: { type: string, format: date, example: 2026-05-01 }
                        maintenanceRecordTypeId:
                            type: string
                            format: uuid
                            description: Must reference an existing, active MaintenanceRecordType
                            example: 019eec10-0000-7000-8000-000000000004
                        mileage: { type: integer, nullable: true, example: 45000 }
                        notes: { type: string, nullable: true, example: null }
                        cost:
                            type: string
                            nullable: true
                            description: Decimal con hasta 2 posiciones, no admite valores negativos
                            example: '120.50'
                        shopName: { type: string, nullable: true, example: Taller Pepe }
                        nextServiceDate: { type: string, format: date, nullable: true, example: null }
                        invoiceId:
                            type: string
                            format: uuid
                            nullable: true
                            description: Debe corresponder a una Invoice existente del mismo vehículo
                            example: null
                MaintenanceRecordType:
                    type: object
                    description: >
                        Fixed catalog entry. Never carries translated text: the client resolves the
                        label from `key` (i18n namespace `maintenanceRecordType.*`).
                    properties:
                        id: { type: string, format: uuid, example: 019eec10-0000-7000-8000-000000000004 }
                        key: { type: string, example: tire_change }
                        icon: { type: string, nullable: true, example: circle-dot }
                        defaultPeriodicityMonths: { type: integer, nullable: true, example: null }
                        defaultPeriodicityKm: { type: integer, nullable: true, example: 40000 }
                        active:
                            type: boolean
                            description: >
                                Inactive entries are still returned so existing records keep resolving
                                their label; only active ones should be offered when creating a record.
                            example: true
                Invoice:
                    type: object
                    properties:
                        id: { type: string, format: uuid, example: 019eec06-4b21-7d33-9c55-2b3c4d5e6f70 }
                        vehicleId: { type: string, format: uuid, example: 019eec01-1e15-7715-9841-572e528a6d80 }
                        uploadedById: { type: string, format: uuid, example: 019eec01-1d2d-7261-a672-2238b9ba1465 }
                        filePath: { type: string, example: 019eec01-1e15-7715-9841-572e528a6d80/019eec06-4b20-7d33-9c55-2b3c4d5e6f70.png }
                        amount: { type: string, nullable: true, example: null }
                        date: { type: string, format: date, nullable: true, example: null }
                        shopName: { type: string, nullable: true, example: null }
                        description: { type: string, nullable: true, example: null }
                        status: { type: string, enum: [pending, verified], example: pending }
                        createdAt: { type: string, format: date-time }
                OcrSuggestion:
                    type: object
                    description: >
                        Sugerencia devuelta por el servicio de OCR. En esta fase
                        App\Maintenance\Infrastructure\Ocr\NullOcrService siempre devuelve todos los
                        campos a null (stub); la integración real de OCR llega en una fase posterior.
                    properties:
                        amount: { type: string, nullable: true, example: null }
                        date: { type: string, nullable: true, example: null }
                        shopName: { type: string, nullable: true, example: null }
                        suggestedType: { type: string, nullable: true, example: null }
                        suggestedNotes: { type: string, nullable: true, example: null }
                InvoiceScanResponse:
                    type: object
                    properties:
                        invoice: { $ref: '#/components/schemas/Invoice' }
                        ocrSuggestion: { $ref: '#/components/schemas/OcrSuggestion' }
    areas:
        default:
            path_patterns: ['^/api']
