nelmio_api_doc:
    documentation:
        paths:
            /api/maintenance-record-types:
                get:
                    tags: [Maintenance]
                    summary: Lists the maintenance record type catalog, ordered by key
                    description: >
                        Returns every entry, active and inactive, so existing records can always resolve
                        their label. Only active entries should be offered when creating a record.
                        The response never contains translated text: the client resolves the label from key.
                    security:
                        - bearerAuth: []
                    responses:
                        '200':
                            description: Listado de tipos de mantenimiento
                            content:
                                application/json:
                                    schema:
                                        type: array
                                        items: { $ref: '#/components/schemas/MaintenanceRecordType' }
                        '401':
                            description: Token JWT ausente o inválido
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/vehicles/{vehicleId}/maintenance-records:
                get:
                    tags: [Maintenance]
                    summary: Lista el historial de mantenimiento de un vehículo
                    description: Ordenado por fecha de servicio (serviceDate) descendente.
                    security:
                        - bearerAuth: []
                    parameters:
                        - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
                    responses:
                        '200':
                            description: Listado de registros de mantenimiento
                            content:
                                application/json:
                                    schema:
                                        type: array
                                        items: { $ref: '#/components/schemas/MaintenanceRecord' }
                        '401':
                            description: Token JWT ausente o inválido
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '403':
                            description: El usuario no tiene acceso a este vehículo (sin vínculo VehicleUser)
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '404':
                            description: El vehículo no existe
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                post:
                    tags: [Maintenance]
                    summary: Crea un registro de mantenimiento
                    description: >
                        Creación manual, o confirmación de una factura escaneada previamente pasando el
                        invoiceId devuelto por POST /api/vehicles/{vehicleId}/invoices/scan. El campo
                        verified no es aceptado por este endpoint, siempre se crea en false.
                    security:
                        - bearerAuth: []
                    parameters:
                        - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema: { $ref: '#/components/schemas/MaintenanceRecordInput' }
                    responses:
                        '201':
                            description: Registro de mantenimiento creado
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/MaintenanceRecord' }
                        '400':
                            description: >
                                Datos de entrada inválidos (serviceDate, maintenanceRecordTypeId, mileage, cost, nextServiceDate),
                                la invoiceId indicada no existe o no pertenece a este vehículo, o el
                                maintenanceRecordTypeId indicado está desactivado (active=false)
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '401':
                            description: Token JWT ausente o inválido
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '403':
                            description: El usuario no tiene acceso de edición a este vehículo
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '404':
                            description: El vehículo no existe, o el maintenanceRecordTypeId indicado no existe
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/vehicles/{vehicleId}/maintenance-records/export:
                get:
                    tags: [Maintenance]
                    summary: Exports a vehicle's maintenance history as a PDF or CSV file
                    description: >
                        Downloads every maintenance record of the vehicle, most recent serviceDate first, with the
                        vehicle's plate, make/model, year and VIN (when set) as document header. The PDF also
                        includes the record count and total cost; the CSV starts with the vehicle data as key/value
                        rows, then an empty row, then the records table. Anyone who can view the vehicle can export it.
                        Record types are stored as keys and the backend holds no translations: send
                        labels[<key>]=<text> for every type the document should print as readable text. Types
                        without a label fall back to the raw key. Column headers are always in English.
                    security:
                        - bearerAuth: []
                    parameters:
                        - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
                        - { name: format, in: query, required: true, schema: { type: string, enum: [pdf, csv] } }
                        - name: labels
                          in: query
                          required: false
                          style: deepObject
                          explode: true
                          description: Maintenance record type key => display label, e.g. labels[oil_change]=Oil change
                          schema:
                              type: object
                              additionalProperties: { type: string, maxLength: 100 }
                              example: { oil_change: Oil change, itv: Vehicle inspection }
                    responses:
                        '200':
                            description: The export file, served as an attachment
                            headers:
                                Content-Disposition:
                                    description: Suggested filename, maintenance-history-<plate>.<format>
                                    schema: { type: string, example: attachment; filename=maintenance-history-1234ABC.pdf }
                            content:
                                application/pdf:
                                    schema: { type: string, format: binary }
                                text/csv:
                                    schema: { type: string }
                        '400':
                            description: format is missing or is not pdf or csv (code INVALID_EXPORT_FORMAT)
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '401':
                            description: Missing or invalid JWT
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '403':
                            description: The user has no access to this vehicle
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '404':
                            description: The vehicle does not exist
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '422':
                            description: labels is not a map of strings of up to 100 characters (code VALIDATION_ERROR)
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/maintenance-records/{id}:
                get:
                    tags: [Maintenance]
                    summary: Detalle de un registro de mantenimiento
                    security:
                        - bearerAuth: []
                    parameters:
                        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
                    responses:
                        '200':
                            description: Registro de mantenimiento encontrado
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/MaintenanceRecord' }
                        '401':
                            description: Token JWT ausente o inválido
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '403':
                            description: El usuario no tiene acceso al vehículo de este registro
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '404':
                            description: El registro de mantenimiento no existe
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                put:
                    tags: [Maintenance]
                    summary: Actualiza un registro de mantenimiento
                    description: Mismo body que la creación manual; tampoco acepta el campo verified.
                    security:
                        - bearerAuth: []
                    parameters:
                        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema: { $ref: '#/components/schemas/MaintenanceRecordInput' }
                    responses:
                        '200':
                            description: Registro de mantenimiento actualizado
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/MaintenanceRecord' }
                        '400':
                            description: >
                                Datos de entrada inválidos, la invoiceId indicada no existe o no pertenece
                                al vehículo de este registro, o el maintenanceRecordTypeId indicado está
                                desactivado (active=false)
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '401':
                            description: Token JWT ausente o inválido
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '403':
                            description: El usuario no tiene acceso de edición al vehículo de este registro
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '404':
                            description: El registro de mantenimiento no existe, o el maintenanceRecordTypeId indicado no existe
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                delete:
                    tags: [Maintenance]
                    summary: Elimina un registro de mantenimiento
                    security:
                        - bearerAuth: []
                    parameters:
                        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
                    responses:
                        '204':
                            description: Registro de mantenimiento eliminado
                        '401':
                            description: Token JWT ausente o inválido
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '403':
                            description: El usuario no tiene acceso de edición al vehículo de este registro
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '404':
                            description: El registro de mantenimiento no existe
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/vehicles/{vehicleId}/invoices/scan:
                post:
                    tags: [Maintenance]
                    summary: Sube una factura y obtiene una sugerencia OCR
                    description: >
                        Guarda el fichero de forma privada (var/storage/invoices/, sin endpoint de
                        descarga en esta fase) y crea una Invoice en estado pending. No crea ningún
                        MaintenanceRecord: el usuario debe confirmarlo con un POST a
                        /api/vehicles/{vehicleId}/maintenance-records pasando el invoiceId devuelto.
                        El campo ocrSuggestion lo genera App\Maintenance\Infrastructure\Ocr\NullOcrService,
                        que en esta fase siempre devuelve todos los campos a null (stub).
                    security:
                        - bearerAuth: []
                    parameters:
                        - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
                    requestBody:
                        required: true
                        content:
                            multipart/form-data:
                                schema:
                                    type: object
                                    required: [file]
                                    properties:
                                        file:
                                            type: string
                                            format: binary
                                            description: PDF, JPG o PNG, máximo 10 MB
                    responses:
                        '201':
                            description: Factura guardada y sugerencia OCR generada
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/InvoiceScanResponse' }
                        '400':
                            description: Fichero ausente, tipo no permitido (solo PDF/JPG/PNG) o tamaño superior a 10 MB
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '401':
                            description: Token JWT ausente o inválido
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '403':
                            description: El usuario no tiene acceso de edición a este vehículo
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '404':
                            description: El vehículo no existe
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
