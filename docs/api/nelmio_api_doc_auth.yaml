nelmio_api_doc:
    documentation:
        paths:
            /api/auth/register:
                post:
                    tags: [Auth]
                    summary: Registra un nuevo usuario
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [email, password, first_name, last_name]
                                    properties:
                                        email: { type: string, format: email, example: ana@example.com }
                                        password: { type: string, format: password, example: Password1 }
                                        first_name: { type: string, example: Ana }
                                        last_name: { type: string, example: García }
                    description: >
                        Creates an unverified account and emails an activation link to the
                        frontend (`FRONTEND_URL/verify-email?token=...`). No tokens are issued:
                        login is rejected with `EMAIL_NOT_VERIFIED` until the email is verified.
                    responses:
                        '201':
                            description: User created, pending email verification
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            id: { type: string, format: uuid }
                                            email: { type: string, format: email }
                                            verification_required: { type: boolean, example: true }
                        '400':
                            description: Datos de entrada inválidos (email, contraseña o nombres)
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '409':
                            description: El email ya está registrado
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/auth/login:
                post:
                    tags: [Auth]
                    summary: Inicia sesión con email y contraseña
                    description: >
                        Ruta interceptada por el firewall `json_login` de Symfony Security antes de
                        llegar a ningún controlador de la aplicación. La respuesta la construye
                        App\Auth\Infrastructure\Security\LoginSuccessHandler.
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [email, password]
                                    properties:
                                        email: { type: string, format: email, example: ana@example.com }
                                        password: { type: string, format: password, example: Password1 }
                    responses:
                        '200':
                            description: Login correcto
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            access_token: { type: string }
                                            refresh_token: { type: string }
                        '401':
                            description: Credenciales inválidas
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '403':
                            description: Correct credentials, but the email has not been verified (`EMAIL_NOT_VERIFIED`)
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/auth/verify-email:
                post:
                    tags: [Auth]
                    summary: Activates an account with the token from the verification email
                    description: >
                        Idempotent: verifying an already verified account with a valid token returns 204.
                        The token is invalidated if the user's email changes.
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [token]
                                    properties:
                                        token: { type: string }
                    responses:
                        '204':
                            description: Email verified
                        '400':
                            description: Malformed or tampered token (`INVALID_VERIFICATION_TOKEN`)
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '410':
                            description: Token expired (`VERIFICATION_TOKEN_EXPIRED`); request a new one via /api/auth/verify-email/resend
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '422':
                            description: Missing token
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/auth/verify-email/resend:
                post:
                    tags: [Auth]
                    summary: Sends a new verification email
                    description: >
                        Always answers 202, whether or not the email belongs to an unverified
                        account, so it cannot be used to discover registered emails.
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [email]
                                    properties:
                                        email: { type: string, format: email, example: ana@example.com }
                    responses:
                        '202':
                            description: Request accepted
                        '422':
                            description: Missing or invalid email
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/auth/refresh:
                post:
                    tags: [Auth]
                    summary: Cambia un refresh token por un access token nuevo
                    description: >
                        Ruta interceptada por el authenticator `refresh-jwt` (GesdinetJWTRefreshTokenBundle).
                        La respuesta la construye App\Auth\Infrastructure\Security\RefreshSuccessHandler.
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [refresh_token]
                                    properties:
                                        refresh_token: { type: string }
                    responses:
                        '200':
                            description: Token renovado
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            access_token: { type: string }
                                            refresh_token: { type: string }
                        '401':
                            description: Refresh token inválido o caducado
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/auth/logout:
                post:
                    tags: [Auth]
                    summary: Cierra sesión e invalida el refresh token indicado
                    description: >
                        Ruta gestionada por el listener `logout` del firewall `api` de Symfony Security
                        (no existe controlador propio de la aplicación).
                    security:
                        - bearerAuth: []
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [refresh_token]
                                    properties:
                                        refresh_token: { type: string }
                    responses:
                        '200':
                            description: Logout correcto
                        '401':
                            description: No autenticado
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/auth/me:
                get:
                    tags: [Auth]
                    summary: Devuelve el perfil del usuario autenticado
                    security:
                        - bearerAuth: []
                    responses:
                        '200':
                            description: Perfil del usuario
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            id: { type: string, format: uuid }
                                            email: { type: string, format: email }
                                            first_name: { type: string }
                                            last_name: { type: string }
                                            roles: { type: array, items: { type: string }, example: [ROLE_USER] }
                                            created_at: { type: string, format: date-time }
                        '401':
                            description: Token JWT ausente o inválido
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
