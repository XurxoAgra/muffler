nelmio_api_doc:
    documentation:
        paths:
            /api/auth/register:
                post:
                    tags: [Auth]
                    summary: Registra un nuevo usuario
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [email, password, first_name, last_name]
                                    properties:
                                        email: { type: string, format: email, example: ana@example.com }
                                        password: { type: string, format: password, example: Password1 }
                                        first_name: { type: string, example: Ana }
                                        last_name: { type: string, example: García }
                    responses:
                        '201':
                            description: Usuario creado
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            access_token: { type: string }
                                            refresh_token: { type: string }
                        '400':
                            description: Datos de entrada inválidos (email, contraseña o nombres)
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
                        '409':
                            description: El email ya está registrado
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/auth/login:
                post:
                    tags: [Auth]
                    summary: Inicia sesión con email y contraseña
                    description: >
                        Ruta interceptada por el firewall `json_login` de Symfony Security antes de
                        llegar a ningún controlador de la aplicación. La respuesta la construye
                        App\Auth\Infrastructure\Security\LoginSuccessHandler.
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [email, password]
                                    properties:
                                        email: { type: string, format: email, example: ana@example.com }
                                        password: { type: string, format: password, example: Password1 }
                    responses:
                        '200':
                            description: Login correcto
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            access_token: { type: string }
                                            refresh_token: { type: string }
                        '401':
                            description: Credenciales inválidas
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/auth/refresh:
                post:
                    tags: [Auth]
                    summary: Cambia un refresh token por un access token nuevo
                    description: >
                        Ruta interceptada por el authenticator `refresh-jwt` (GesdinetJWTRefreshTokenBundle).
                        La respuesta la construye App\Auth\Infrastructure\Security\RefreshSuccessHandler.
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [refresh_token]
                                    properties:
                                        refresh_token: { type: string }
                    responses:
                        '200':
                            description: Token renovado
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            access_token: { type: string }
                                            refresh_token: { type: string }
                        '401':
                            description: Refresh token inválido o caducado
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/auth/logout:
                post:
                    tags: [Auth]
                    summary: Cierra sesión e invalida el refresh token indicado
                    description: >
                        Ruta gestionada por el listener `logout` del firewall `api` de Symfony Security
                        (no existe controlador propio de la aplicación).
                    security:
                        - bearerAuth: []
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [refresh_token]
                                    properties:
                                        refresh_token: { type: string }
                    responses:
                        '200':
                            description: Logout correcto
                        '401':
                            description: No autenticado
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
            /api/auth/me:
                get:
                    tags: [Auth]
                    summary: Devuelve el perfil del usuario autenticado
                    security:
                        - bearerAuth: []
                    responses:
                        '200':
                            description: Perfil del usuario
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            id: { type: string, format: uuid }
                                            email: { type: string, format: email }
                                            first_name: { type: string }
                                            last_name: { type: string }
                                            roles: { type: array, items: { type: string }, example: [ROLE_USER] }
                                            created_at: { type: string, format: date-time }
                        '401':
                            description: Token JWT ausente o inválido
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ErrorResponse' }
