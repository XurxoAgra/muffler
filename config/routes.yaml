# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

controllers:
    resource: routing.controllers

# These two paths are intercepted by Symfony's security firewall (json_login
# and the refresh-jwt authenticator) before the router would ever dispatch to
# a controller. The routes only exist so the router doesn't 404 first.
auth.login:
    path: /api/auth/login
    methods: [POST]
    controller: App\Shared\Infrastructure\Http\UnreachableController

auth.refresh:
    path: /api/auth/refresh
    methods: [POST]
    controller: App\Shared\Infrastructure\Http\UnreachableController
