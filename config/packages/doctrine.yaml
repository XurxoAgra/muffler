doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        types:
            uuid: Symfony\Bridge\Doctrine\Types\UuidType
            user_id: App\Auth\Infrastructure\Persistence\Type\UserIdType
            user_email: App\Auth\Infrastructure\Persistence\Type\UserEmailType
            user_password: App\Auth\Infrastructure\Persistence\Type\UserPasswordType
            user_roles: App\Auth\Infrastructure\Persistence\Type\UserRolesType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        mappings:
            AuthInfrastructure:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Auth/Infrastructure/Persistence/Mapping'
                prefix: 'App\Auth\Infrastructure\Persistence'
                alias: AuthInfrastructure
            AuthDomain:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Auth/Infrastructure/Persistence/MappingDomain'
                prefix: 'App\Auth\Domain\User'
                alias: AuthDomain
            VehicleDomain:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Vehicle/Infrastructure/Persistence/Mapping'
                prefix: 'App\Vehicle\Domain'
                alias: VehicleDomain
            MaintenanceDomain:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Maintenance/Infrastructure/Persistence/Mapping'
                prefix: 'App\Maintenance\Domain'
                alias: MaintenanceDomain

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
