# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/**/Domain/'
            - '../src/**/Http/Request/*Request.php'

    # Bind ports (interfaces) to their infrastructure adapters — autowiring
    # cannot resolve interfaces on its own.
    App\Auth\Application\Port\PasswordHasher: '@App\Auth\Infrastructure\Security\SymfonyPasswordHasher'
    App\Auth\Application\Port\TokenGenerator: '@App\Auth\Infrastructure\Security\LexikTokenGenerator'
    App\Auth\Domain\User\UserRepository: '@App\Auth\Infrastructure\Persistence\DoctrineUserRepository'
    App\Vehicle\Domain\VehicleRepository: '@App\Vehicle\Infrastructure\Persistence\DoctrineVehicleRepository'
    App\Vehicle\Domain\VehicleUserRepository: '@App\Vehicle\Infrastructure\Persistence\DoctrineVehicleUserRepository'
    App\Vehicle\Domain\VehicleMakeRepository: '@App\Vehicle\Infrastructure\Persistence\DoctrineVehicleMakeRepository'
    App\Vehicle\Domain\VehicleModelRepository: '@App\Vehicle\Infrastructure\Persistence\DoctrineVehicleModelRepository'
    App\Vehicle\Application\ImportVehicleCatalog\VehicleCatalogFileReader: '@App\Vehicle\Infrastructure\Import\FileVehicleCatalogReader'
    App\Maintenance\Domain\InvoiceRepository: '@App\Maintenance\Infrastructure\Persistence\DoctrineInvoiceRepository'
    App\Maintenance\Domain\MaintenanceRecordRepository: '@App\Maintenance\Infrastructure\Persistence\DoctrineMaintenanceRecordRepository'
    App\Maintenance\Application\Port\UserReferenceProvider: '@App\Maintenance\Infrastructure\Persistence\DoctrineUserReferenceProvider'
    App\Maintenance\Application\Port\FileUploaderInterface: '@App\Maintenance\Infrastructure\Storage\LocalFileUploader'
    App\Maintenance\Application\Port\OcrServiceInterface: '@App\Maintenance\Infrastructure\Ocr\NullOcrService'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
